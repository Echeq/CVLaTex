# Continuous integration: run the test suite on Linux, then build the three
# native release archives and upload them as workflow artifacts.
#
# Artifacts:
#   CVLaTeX-v<version>-windows-x64.zip
#   CVLaTeX-v<version>-linux-x86_64.tar.gz
#   CVLaTeX-v<version>-macos-arm64.zip
#
# This workflow never publishes a release; tagged releases are handled by
# release.yml. Pushes are restricted to branches so a v* tag only triggers the
# release workflow.
#
# Linux runtime note: the frozen bundle still needs the system WebKitGTK and
# GObject-introspection packages on the TARGET machine (Debian/Ubuntu:
# python3-gi, gir1.2-webkit2-4.1 and libwebkit2gtk-4.1-dev, or the Qt5/Qt6
# equivalent), because PyInstaller cannot bundle the native webview engine.
# The Linux build job installs them (plus python3-venv) so the build venv can
# import gi and PyInstaller can bundle the GTK backend; build.sh recreates the
# venv with --system-site-packages against /usr/bin/python3 to make that
# visible.

name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q -n 2

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CVLaTeX-windows-x64
            path: dist/CVLaTeX-v*-windows-x64.zip
          - os: ubuntu-latest
            artifact: CVLaTeX-linux-x86_64
            path: dist/CVLaTeX-v*-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: CVLaTeX-macos-arm64
            path: dist/CVLaTeX-v*-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux webview packages (build environment)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CI: "true"
        run: build.bat

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build.sh
          PYTHON=/usr/bin/python3 ./build.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
