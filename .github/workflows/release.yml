# Publish a GitHub Release for a vX.Y.Z tag.
#
# The tag must match version.__version__. The workflow runs the test suite,
# builds the three native archives, verifies their contents, generates
# SHA256SUMS.txt and publishes the release with gh. Tags in the 0.* series are
# marked as pre-releases. No PAT is needed: only the publish job receives
# contents: write.
#
# Published assets:
#   CVLaTeX-v<version>-windows-x64.zip
#   CVLaTeX-v<version>-linux-x86_64.tar.gz
#   CVLaTeX-v<version>-macos-arm64.zip
#   SHA256SUMS.txt
#
# GitHub's macos-latest runner is Apple Silicon (arm64) at the time of writing,
# so the release workflow builds and publishes the arm64 archive. The build job
# verifies the runner architecture instead of silently renaming a different
# bundle.
#
# Code signing and notarization are explicitly deferred; the assets are
# unsigned.
#
# Linux runtime note: the frozen bundle still needs the system WebKitGTK and
# GObject-introspection packages on the TARGET machine (Debian/Ubuntu:
# python3-gi, gir1.2-webkit2-4.1 and libwebkit2gtk-4.1-dev, or the Qt5/Qt6
# equivalent), because PyInstaller cannot bundle the native webview engine.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q -n 2

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CVLaTeX-windows-x64
            path: dist/CVLaTeX-v*-windows-x64.zip
          - os: ubuntu-latest
            artifact: CVLaTeX-linux-x86_64
            path: dist/CVLaTeX-v*-linux-x86_64.tar.gz
          - os: macos-latest
            artifact: CVLaTeX-macos-arm64
            path: dist/CVLaTeX-v*-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux webview packages (build environment)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CI: "true"
        run: build.bat

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build.sh
          PYTHON=/usr/bin/python3 ./build.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify macOS architecture
        if: runner.os == 'macOS'
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "error: the macOS release job must run on Apple Silicon (found $(uname -m))" >&2
            exit 1
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: CVLaTeX-*
          merge-multiple: true

      - name: Verify tag, archive contents and checksums
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import version; print(version.__version__)')"
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match version.py (v${VERSION})" >&2
            exit 1
          fi

          WINDOWS="CVLaTeX-v${VERSION}-windows-x64.zip"
          LINUX="CVLaTeX-v${VERSION}-linux-x86_64.tar.gz"
          MACOS="CVLaTeX-v${VERSION}-macos-arm64.zip"

          mkdir -p release-assets/publish
          for name in "$WINDOWS" "$LINUX" "$MACOS"; do
            src="$(find release-assets -type f -name "$name" -print -quit)"
            if [ -z "$src" ]; then
              echo "error: missing release archive: $name" >&2
              find release-assets -maxdepth 5 -type f -print >&2
              exit 1
            fi
            cp -f "$src" "release-assets/publish/$name"
          done

          cd release-assets/publish
          python - "$VERSION" <<'PY'
          import sys
          import tarfile
          import zipfile

          version = sys.argv[1]
          required_docs = ["README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
          checks = {
              "CVLaTeX-v%s-windows-x64.zip" % version: ("zip", ["CVLaTeX.exe"]),
              "CVLaTeX-v%s-linux-x86_64.tar.gz" % version: ("tar", ["CVLaTeX"]),
              "CVLaTeX-v%s-macos-arm64.zip" % version: ("zip", []),
          }

          for name, (kind, binaries) in checks.items():
              if kind == "zip":
                  with zipfile.ZipFile(name) as archive:
                      entries = archive.namelist()
              else:
                  with tarfile.open(name, "r:gz") as archive:
                      entries = archive.getnames()
                      member = archive.getmember("CVLaTeX")
                      if not member.mode & 0o111:
                          raise SystemExit("error: %s executable bit is not set" % name)
              missing = [entry for entry in binaries + required_docs if entry not in entries]
              if not any(entry.startswith("CVLaTeX.app/") for entry in entries) and "macos" in name:
                  missing.append("CVLaTeX.app/")
              if missing:
                  raise SystemExit("error: %s is missing %s" % (name, ", ".join(missing)))
              print("verified %s: %d entries" % (name, len(entries)))
          PY

          sha256sum "$WINDOWS" "$LINUX" "$MACOS" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release-assets/publish
          assets=(
            "CVLaTeX-v${VERSION}-windows-x64.zip"
            "CVLaTeX-v${VERSION}-linux-x86_64.tar.gz"
            "CVLaTeX-v${VERSION}-macos-arm64.zip"
            "SHA256SUMS.txt"
          )
          for asset in "${assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "error: expected asset is missing: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Idempotent rerun: keep the existing release, refresh the assets
            # and make sure it stays a pre-release.
            gh release edit "$GITHUB_REF_NAME" --prerelease
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "CVLaTeX ${GITHUB_REF_NAME}" \
              --generate-notes \
              --prerelease
          fi
