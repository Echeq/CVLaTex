# Publish a GitHub Release for a vX.Y.Z tag.
#
# The tag must match version.__version__. The workflow runs the test suite,
# builds the three native bundles, verifies/normalizes the asset names,
# generates SHA256SUMS.txt and creates the release with gh. Tags in the 0.*
# series are marked as pre-releases. No PAT is needed: the workflow token has
# contents: write for this repository.
#
# Asset names:
#   CVLaTeX-v${VERSION}-windows-x64.exe
#   CVLaTeX-v${VERSION}-linux-x86_64
#   CVLaTeX-v${VERSION}-macos-<arch>.zip
#
# GitHub's macos-latest runner is Apple Silicon (arm64) at the time of writing,
# so the first release is expected to publish CVLaTeX-vX.Y.Z-macos-arm64.zip.
# The build step derives the suffix from runner.arch, so an Intel runner
# produces macos-x86_64.zip without a workflow change.
#
# Linux runtime note: the frozen bundle still needs the system WebKitGTK and
# GObject-introspection packages on the TARGET machine (Debian/Ubuntu:
# python3-gi, gir1.2-webkit2-4.1 and libwebkit2gtk-4.1-dev, or the Qt5/Qt6
# equivalent), because PyInstaller cannot bundle the native webview engine.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CVLaTeX_Windows
            path: dist/CVLaTeX_Windows.exe
          - os: ubuntu-latest
            artifact: CVLaTeX_Linux
            path: dist/CVLaTeX_Linux
          - os: macos-latest
            artifact: CVLaTeX_macOS
            path: dist/CVLaTeX_macOS-*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux webview packages (build environment)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-venv gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name CVLaTeX --icon "assets/CVLaTex.ico" --add-data "web;web" --add-data "templates;templates" main.py
          Move-Item -Force dist/CVLaTeX.exe dist/CVLaTeX_Windows.exe

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build.sh
          PYTHON=/usr/bin/python3 ./build.sh
          chmod +x dist/CVLaTeX_Linux

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Tag the macOS bundle with the runner architecture
        if: runner.os == 'macOS'
        env:
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          case "$arch" in
            x64) arch="x86_64" ;;
            arm64) arch="arm64" ;;
            *)
              echo "error: unsupported macOS runner architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          mv "dist/CVLaTeX_macOS.zip" "dist/CVLaTeX_macOS-${arch}.zip"
          echo "macOS bundle: dist/CVLaTeX_macOS-${arch}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: CVLaTeX_*
          merge-multiple: true

      - name: Verify tag and assemble versioned assets
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import version; print(version.__version__)')"
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "error: tag $GITHUB_REF_NAME does not match version.py (v${VERSION})" >&2
            exit 1
          fi

          if [ ! -d release-assets ]; then
            echo "error: release-assets directory is missing" >&2
            exit 1
          fi

          # upload-artifact may preserve a `dist/` prefix or place files at the
          # artifact root; locate each bundle by name instead of assuming a path.
          windows_src="$(find release-assets -type f -name 'CVLaTeX_Windows.exe' -print -quit)"
          linux_src="$(find release-assets -type f -name 'CVLaTeX_Linux' -print -quit)"
          macos_src="$(find release-assets -type f -name 'CVLaTeX_macOS-*.zip' -print -quit)"

          missing=0
          for src in "$windows_src" "$linux_src" "$macos_src"; do
            if [ -z "$src" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "error: missing one or more release artifacts; downloaded tree:" >&2
            find release-assets -maxdepth 5 -type f -print >&2
            exit 1
          fi

          mv "$windows_src" "release-assets/CVLaTeX-v${VERSION}-windows-x64.exe"
          mv "$linux_src" "release-assets/CVLaTeX-v${VERSION}-linux-x86_64"
          arch="${macos_src##*/CVLaTeX_macOS-}"
          arch="${arch%.zip}"
          arch="$(printf '%s' "$arch" | tr '[:upper:]' '[:lower:]')"
          mv "$macos_src" "release-assets/CVLaTeX-v${VERSION}-macos-${arch}.zip"

          cd release-assets
          # Checksums cover every published asset; the manifest itself is not hashed.
          sha256sum CVLaTeX-v"${VERSION}"-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/CVLaTeX-v"${VERSION}"-* release-assets/SHA256SUMS.txt)
          if [ "${#assets[@]}" -lt 4 ]; then
            echo "error: expected three bundles plus SHA256SUMS.txt, found ${#assets[@]}" >&2
            exit 1
          fi
          args=(--title "CVLaTeX ${GITHUB_REF_NAME}" --generate-notes)
          case "$VERSION" in
            0.*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${args[@]}"
